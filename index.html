<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>PiKa Store</title><link rel="icon" type="image/png" href=""><link rel="apple-touch-icon" href="">
<style>
:root{--g:#0a8a3c;--t:#000;--m:#5f6368;--l:#e8eaed;--bg:#fff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);font-family:Roboto,system-ui,sans-serif;max-width:480px;margin:auto;min-height:100vh;padding-bottom:96px}
header{position:sticky;top:0;background:#fff;z-index:5;padding:env(safe-area-inset-top) 16px 0}
.top{display:flex;align-items:center;gap:8px;padding:10px 0}
.top img{width:36px;height:36px;object-fit:contain}.top h1{font-size:18px;flex:1}
.tabs{display:flex;border-bottom:1px solid var(--l);overflow-x:auto}
.tabs button{flex:1;background:none;border:0;padding:10px 8px;font-size:13px;color: #4C4C4C;border-bottom:3px solid transparent;white-space:nowrap
 ; font-weight: bold;
}
.tabs .on{color: #0B7F01;font-weight:600;border-color:var(--g); font-weight: bold;}
main{padding:14px 16px}
h2{font-size:15px;margin:18px 0 8px}
.car{position:relative;overflow:hidden;border-radius:20px;aspect-ratio:16/9;background:var(--l);touch-action:pan-y;user-select:none}
.bs{position:absolute;inset:0;color:#fff;will-change:transform;cursor:pointer}
.bs>img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.bt{position:absolute;left:0;right:0;bottom:0;padding:32px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.78));display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.bt b{font-size:18px}.bt span{font-size:13px;opacity:.92;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:80%}
.bt .btn{margin-top:5px;padding:7px 22px;box-shadow:none}
.dots{position:absolute;bottom:12px;right:12px;display:flex;gap:5px;z-index:2}.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.55);transition:.3s}.dots i.on{width:16px;background:#fff}
.dotb{background:none;border:0;padding:8px;border-radius:50%;display:flex}.dotb:active{background:var(--l)}
#mn{display:none;position:fixed;top:0;bottom:0;left:50%;width:100%;max-width:480px;transform:translateX(-50%);z-index:40}
#mn .bx{position:absolute;top:calc(env(safe-area-inset-top) + 50px);right:12px;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.28);padding:6px 0;min-width:235px;max-height:82vh;overflow-y:auto}
#mn button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 18px;font-size:15px;color:#202124}#mn button:active{background:var(--l)}#mn hr{border:0;border-top:1px solid var(--l);margin:4px 0}
.ex{font-size:15px;margin:14px 0 10px;font-weight:700;color:#505153}
.eg{display:grid;grid-template-columns:1fr 1fr;gap:3px;border-radius:18px;overflow:hidden;margin-bottom:8px}
.ec{background:#eff1f7;padding:0 14px;min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;font-weight:700;color:#4A5064}.ec:active{background:#e1e5ef}
.ec svg{width:34px;height:34px;flex:none}
.bk{background:none;border:0;color:var(--g);font-size:16px;font-weight:600;padding:8px 0}
.row{display:flex;align-items:center;gap:12px;padding:9px 0}
.row .n{width:16px;font-weight:600}
.ic{width:60px;height:60px;border-radius:14px;object-fit:cover;background:var(--l);flex:none}
.inf{flex:1;min-width:0}.inf b{display:block;font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inf small{color:var(--m);font-size:13px}
.btn{background: #2269D5;color:#fff;border:0;border-radius:20px;box-shadow: 0px 5px 7px #A3B2D9;padding:9px 18px;font-size:14px;font-weight:500}
.btn.big{width:100%;padding:9px;font-size:17px;border-radius:20px;margin:14px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.chips button{border:0;background:var(--l);padding:8px 18px;border-radius:18px;font-size:14px;white-space:nowrap}
.chips .on{background:var(--g);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{border:1px solid var(--l);border-radius:14px;padding:18px 10px;text-align:center;font-weight:500;background:#fff}
input.s{width:100%;padding:13px 16px;border:1px solid var(--l);border-radius:24px;font-size:15px;margin-bottom:8px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#f0f3f9;display:flex;padding:12px 4px calc(14px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;background:none;border:0;padding:0;font-size:12px;font-weight:500;letter-spacing:.2px;color:#444746;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit}
nav .pl{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:background .25s,color .25s}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav .d2{fill:currentColor;stroke:none}
nav .on{color:#004a77;font-weight:700}nav .on .pl{background:#c2e7ff}
nav .on .b{fill:currentColor}nav .on .d{stroke:#c2e7ff}nav .on .d2{fill:#c2e7ff}nav .on .sr{stroke-width:2.6}
#det,#pg{position:fixed;inset:0;background:#fff;z-index:20;overflow-y:auto;max-width:480px;margin:auto;padding:env(safe-area-inset-top) 16px 30px;display:none}
.stats{display:flex;text-align:center;margin:16px 0}.stats div{flex:1;border-left:1px solid var(--l)}.stats div:first-child{border:0}
.stats b{display:block}.stats small{color:var(--m)}
.shots{display:flex;gap:10px;overflow-x:auto}.shots img{height:220px;border-radius:12px;flex:none}
.empty{text-align:center;color:var(--m);padding:40px 0}
#login{display:none;max-width:400px;margin:8vh auto;padding:20px}#login input{width:100%;padding:13px;border:1px solid var(--l);border-radius:12px;font-size:15px;margin-bottom:12px}
body.out #login{display:block}body.out header,body.out main,body.out nav,body.out #det,body.out #pg,body.out #mn{display:none!important}
#dl{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;align-items:flex-end;justify-content:center}
.sh{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.bar{height:8px;background:var(--l);border-radius:4px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--g);transition:width .3s}
body.out #dl{display:none!important}

function bfin(c,nx,dir,ni){busy=true;bset(nx,0,true);bset(c,100*dir,true);setTimeout(()=>{c.style.visibility='hidden';bi=ni;busy=false;bdots()},470)}
function bgo(ni,dir){const car=$('car');if(!car||busy)return;const S=car.querySelectorAll('.bs');if(S.length<2)return;const c=S[bi],nx=S[ni];bset(nx,-100*dir,false);nx.style.visibility='visible';nx.offsetWidth;bfin(c,nx,dir,ni)}
function bstart(){clearInterval(bt);bt=setInterval(()=>{const car=$('car');if(!car||document.hidden||busy)return;bgo((bi+1)%car.querySelectorAll('.bs').length,1)},5000)}
function initCar(){clearInterval(bt);bi=0;busy=false;const c=$('car');if(!c||c.querySelectorAll('.bs').length<2)return;bstart();
 let sx=0,dx=0,on=false,tg=null;
 c.addEventListener('touchstart',e=>{if(busy)return;sx=e.touches[0].clientX;dx=0;on=true;tg=null;moved=false;clearInterval(bt)},{passive:true});
 c.addEventListener('touchmove',e=>{if(!on)return;dx=e.touches[0].clientX-sx;const W=c.offsetWidth,S=c.querySelectorAll('.bs'),n=S.length,dir=dx>0?1:-1,ni=(bi+dir+n)%n;
  if(tg!==null&&tg!==ni)S[tg].style.visibility='hidden';tg=ni;S[ni].style.visibility='visible';bset(S[bi],dx,false,'px');bset(S[ni],dx-dir*W,false,'px')},{passive:true});
 const end=()=>{if(!on)return;on=false;moved=Math.abs(dx)>8;if(tg===null){bstart();return}
  const W=c.offsetWidth,S=c.querySelectorAll('.bs'),dir=dx>0?1:-1,cv=S[bi],nx=S[tg],t=tg;
  if(Math.abs(dx)>W*.2)bfin(cv,nx,dir,t);else{bset(cv,0,true);bset(nx,-100*dir,true);setTimeout(()=>{nx.style.visibility='hidden'},470)}
  tg=null;dx=0;bstart()};
 c.addEventListener('touchend',end);c.addEventListener('touchcancel',end)}
